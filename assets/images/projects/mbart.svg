  <g opacity=".85" transform="translate(300 180)"><g fill="#fff" font-family="serif" text-anchor="middle"><text y="12" font-size="60" font-weight="600">A文</text></g></g>
  <g font-family="'Inter', sans-serif" fill="#fff" opacity=".9">
    <text x="300" y="320" text-anchor="middle" font-size="22" font-weight="600">Multilingual Translation</text>
